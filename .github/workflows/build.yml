name: Build macOS app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal release
        run: ./script/package.sh
      - name: Validate bundle and architecture
        run: |
          plutil -lint dist/AwakeBar.app/Contents/Info.plist
          codesign --verify --strict dist/AwakeBar.app
          lipo dist/AwakeBar.app/Contents/MacOS/AwakeBar -verify_arch arm64 x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: AwakeBar-macos-universal
          path: |
            dist/AwakeBar-1.0.0-macos-universal.zip
            dist/SHA256SUMS
